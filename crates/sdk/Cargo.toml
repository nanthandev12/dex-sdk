[package]
name = "perpl-sdk"
build = "build.rs"
edition.workspace = true
version.workspace = true

[dependencies]
alloy.workspace = true
alloy-sol-types.workspace = true
chrono.workspace = true
colored = { workspace = true, optional = true }
dashmap.workspace = true
derive_more.workspace = true
fastnum.workspace = true
futures.workspace = true
itertools.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"], optional = true }
tabled = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
alloy = { workspace = true, features = ["node-bindings"] }
tabled = { workspace = true }
tokio = { workspace = true }

[features]
default = ["display", "testing"]
display = ["tabled", "colored"]
# Separate from `testing` (which is in `default` and enables alloy/node-bindings)
# so that downstream crates can opt in to test builders (Perpetual::for_test,
# with_bid, with_ask, etc.) via dev-dependencies without exposing internal
# mutation methods in production builds.
test-utils = []
testing = ["alloy/node-bindings"]
# Enables the `transport` module (source-IP-bound HTTP/WS provider helpers).
# Pulls in `reqwest` for the HTTP path; `rustls` installs the process-wide
# crypto provider before TLS handshakes.
transport = ["dep:reqwest", "dep:url", "dep:rustls"]
# Enables the `transport` module's WebSocket provider helper
# (`transport::ws_provider`), which requires alloy's `provider-ws` feature plus
# a direct `tokio-tungstenite` dep for source-IP-bound WS sockets. Implies
# `transport` (the HTTP helpers are always available with it).
ws = [
  "transport",
  "alloy/provider-ws",
  "alloy/pubsub",
  "dep:tokio",
  "dep:tokio-tungstenite",
]

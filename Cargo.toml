[workspace]
resolver = "3"
members = ["crates/sdk", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.0.4", default-features = false, features = [
  "contract",
  "eips",
  "provider-http",
  "reqwest",
  "reqwest-rustls-tls",
  "rpc",
  "rpc-client",
  "rpc-types",
  "transport-throttle",
] }
alloy-sol-types = { version = "1.5.7", default-features = false, features = [
  "more-tuple-impls",
] }
anyhow = { version = "1.0.102" }
chrono = { version = "0.4.44", default-features = false, features = ["alloc"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = { version = "3.1.1" }
crossterm = { version = "0.29.0" }
dashmap = { version = "6.1.0" }
derive_more = { version = "2.1.1", default-features = false, features = [
  "debug",
] }
fastnum = { version = "0.7.4" }
futures = { version = "0.3.32" }
itertools = { version = "0.14.0" }
# HTTP client used by the `transport` module to bind outbound connections to a
# configured source (elastic) IP. Pinned to alloy 2.0.4's resolved reqwest so
# cargo unifies on one copy. `rustls` keeps TLS on the process-wide crypto
# provider (matching alloy's `reqwest-rustls-tls` feature).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tabled = { version = "0.20.0", features = ["ansi"] }
thiserror = { version = "2.0.18" }
# WebSocket client used by the `transport` module's `ws` feature to bind
# outbound WS connections to a configured source IP. Pinned to the version
# alloy-transport-ws 2.1.1 resolves (0.28) so cargo unifies on one copy.
# `connect` provides the tokio TCP connector; `rustls-tls-webpki-roots` matches
# alloy-transport-ws's TLS setup.
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
tokio = { version = "1.52.2", features = [
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
] }
tokio-util = { version = "0.7.18" }
url = { version = "2.5" }

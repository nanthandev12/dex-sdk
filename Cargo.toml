[workspace]
resolver = "3"
members = ["crates/sdk", "crates/cli"]

[workspace.package]
version = "0.2.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerplFoundation/dex-sdk"

[workspace.dependencies]
alloy = { version = "2.5.0", default-features = false, features = [
  "contract",
  "eips",
  "provider-http",
  "reqwest",
  "reqwest-rustls-tls",
  "rpc",
  "rpc-client",
  "rpc-types",
  "transport-throttle",
] }
alloy-sol-types = { version = "1.7.3", default-features = false, features = [
  "more-tuple-impls",
] }
anyhow = { version = "1.0.104" }
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = { version = "3.1.1" }
crossterm = { version = "0.29.0" }
dashmap = { version = "6.2.1" }
derive_more = { version = "2.1.1", default-features = false, features = [
  "debug",
] }
fastnum = { version = "0.7.5" }
futures = { version = "0.3.34" }
itertools = { version = "0.15.0" }
tabled = { version = "0.22.0", features = ["ansi"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = [
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
] }
# HTTP client used by the `transport` module to bind outbound connections to a
# configured source (elastic) IP. Pinned to alloy 2.0.4's resolved reqwest so
# cargo unifies on one copy. `rustls` keeps TLS on the process-wide crypto
# provider (matching alloy's `reqwest-rustls-tls` feature).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# WebSocket client used by the `transport` module's `ws` feature to bind
# outbound WS connections to a configured source IP. Pinned to the version
# alloy-transport-ws 2.3.x resolves (0.29) so cargo unifies on one copy — the
# `WsBackend::spawn` we call is only implemented for the exact tokio-tungstenite
# stream type alloy-transport-ws is built against, so these must match.
# `connect` provides the tokio TCP connector; `rustls-tls-webpki-roots` matches
# alloy-transport-ws's TLS setup.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7.19" }
url = { version = "2.5" }
